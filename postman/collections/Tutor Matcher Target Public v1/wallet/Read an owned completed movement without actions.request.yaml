  Derived target request. Use synthetic IDs and runtime credentials. See contracts/examples/cases.json; target behavior is
  not implemented yet.'
url: '{{baseUrl}}/wallet/transactions/:transactionId'
method: GET
headers:
- key: X-Request-Id
  value: '{{requestId}}'
  disabled: false
  description: X-Request-Id
- key: Accept
  value: application/json
pathVariables:
- key: transactionId
  value: '{{transactionId}}'
  disabled: false
  description: (Required) transactionId
auth:
  type: bearer
  credentials:
    token: '{{bearerToken}}'
settings: {}
order: 3000
