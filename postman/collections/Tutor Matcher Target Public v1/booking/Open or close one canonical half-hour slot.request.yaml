$kind: http-request
description: 'For an existing slot require If-Match. For a new slot require If-None-Match: *. Exactly one precondition is
  allowed. No blind upsert or edit of a held/booked slot.See contracts/README.md for semantic invariants, privacy, retries
  and pending outcomes.

  Derived target request. Use synthetic IDs and runtime credentials. See contracts/examples/cases.json; target behavior is
  not implemented yet.'
url: '{{baseUrl}}/profiles/me/tutor/availability/:date/:time'
method: PUT
headers:
- key: X-Request-Id
  value: '{{requestId}}'
  disabled: false
  description: X-Request-Id
- key: Idempotency-Key
  value: '{{idempotencyKey}}'
  disabled: false
  description: (Required) Stable for retries of one logical action. Resolve authorized replay before checking a stale revision.
- key: If-Match
  value: '"{{revision}}"'
  disabled: true
  description: If-Match
- key: If-None-Match
  value: '*'
  disabled: false
  description: If-None-Match
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
pathVariables:
- key: date
  value: '2026-11-06'
  disabled: false
  description: (Required) date
- key: time
  value: '10:00'
  disabled: false
  description: (Required) time
body:
  type: json
  content: "{\n  \"state\": \"OPEN\",\n  \"subjectIds\": [\n    \"00000005-1111-4111-8111-111111111111\"\n  ]\n}"
auth:
  type: bearer
  credentials:
    token: '{{bearerToken}}'
settings: {}
order: 3000
