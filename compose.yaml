name: tutor-matcher
x-app:
  restart: unless-stopped
  init: true
  networks: &id001
  - private
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?supply database administrator credential}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?supply owner credential}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?supply owner credential}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?supply owner credential}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./docker/postgres-owned-databases.sh:/docker-entrypoint-initdb.d/00-owned-databases.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
    - private
  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: auth
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_AUTH_PASSWORD:?supply broker producer credential}
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
    - private
  consul:
    image: hashicorp/consul:1.21.4
    command: agent -dev -client=0.0.0.0 -ui
    networks:
    - private
    healthcheck:
      test:
      - CMD
      - consul
      - members
      interval: 5s
      timeout: 3s
      retries: 20
  auth-service:
    restart: unless-stopped
    init: true
    networks: *id001
    build:
      context: .
      dockerfile: docker/workspace.Dockerfile
      args:
        WORKSPACE: auth-service
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      CONSUL_URL: http://consul:8500
      DEMO_MODE: 'true'
      PORT: '4002'
      GRPC_PORT: '50051'
      DATABASE_URL: postgresql://auth_owner:${AUTH_DB_PASSWORD}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:?supply session signing key}
      RESET_CONTENT_KEY: ${RESET_CONTENT_KEY:?supply reset content encryption key}
      IDEMPOTENCY_SECRET: ${IDEMPOTENCY_SECRET:?supply replay fingerprint key}
      ADMIN_SIGNUP_KEY: ${ADMIN_SIGNUP_KEY:-}
      RABBITMQ_URL: amqp://auth:${RABBITMQ_AUTH_PASSWORD}@rabbitmq:5672
      RESET_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}/password-reset
      AUTH_WORKLOAD_CREDENTIAL: ${AUTH_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      TUTOR_WORKLOAD_CREDENTIAL: ${TUTOR_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      BOOKING_WORKLOAD_CREDENTIAL: ${BOOKING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      WALLET_WORKLOAD_CREDENTIAL: ${WALLET_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      REVIEW_WORKLOAD_CREDENTIAL: ${REVIEW_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      MESSAGING_WORKLOAD_CREDENTIAL: ${MESSAGING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      NOTIFICATION_WORKLOAD_CREDENTIAL: ${NOTIFICATION_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      SERVICE_ADVERTISE_ADDRESS: auth-service
      AUTH_SYNTHETIC_EMAILS: ${AUTH_SYNTHETIC_EMAILS:-}
      AUTH_SYNTHETIC_USER_IDS: ${AUTH_SYNTHETIC_USER_IDS:-}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://localhost:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 30
  api-gateway:
    restart: unless-stopped
    init: true
    networks: *id001
    build:
      context: .
      dockerfile: docker/workspace.Dockerfile
      args:
        WORKSPACE: api-gateway
    ports:
    - 127.0.0.1:8080:8080
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      CONSUL_URL: http://consul:8500
      DEMO_MODE: 'true'
      PORT: '8080'
      JWT_SECRET: ${JWT_SECRET}
      ACTOR_ASSERTION_PRIVATE_KEY: ${ACTOR_ASSERTION_PRIVATE_KEY:?supply actor signing key}
      AUTH_URL: http://auth-service:4002
      TUTOR_URL: http://tutor-service:4001
      BOOKING_URL: http://booking-service:4004
      WALLET_URL: http://wallet-service:4003
      REVIEW_URL: http://review-service:4005
      MESSAGING_URL: http://messaging-service:4006
      NOTIFICATION_URL: http://notification-service:4007
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
    depends_on:
      auth-service:
        condition: service_healthy
  web:
    restart: unless-stopped
    init: true
    networks: *id001
    build:
      context: .
      dockerfile: docker/workspace.Dockerfile
      args:
        WORKSPACE: web
    ports:
    - 127.0.0.1:3000:3000
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
    - api-gateway
  mongo:
    image: mongo:7
    profiles:
    - target
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?supply Mongo administrator credential}
      MONGO_CLUSTER_KEY: ${MONGO_CLUSTER_KEY:?supply replica-set key}
    entrypoint:
    - /bin/bash
    - -ec
    command:
    - printf "%s" "$$MONGO_CLUSTER_KEY" > /tmp/replica-key; chmod 400 /tmp/replica-key; chown mongodb /tmp/replica-key;
      exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/replica-key
    volumes:
    - mongo-data:/data/db
    networks:
    - private
  mongo-init:
    image: mongo:7
    profiles:
    - target
    restart: on-failure
    depends_on:
    - mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      TUTOR_DB_PASSWORD: ${TUTOR_DB_PASSWORD:?supply owner credential}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?supply owner credential}
      MESSAGING_DB_PASSWORD: ${MESSAGING_DB_PASSWORD:?supply owner credential}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?supply owner credential}
    entrypoint:
    - mongosh
    - --host
    - mongo
    - --quiet
    - /setup/mongo-init.js
    volumes:
    - ./docker/mongo-init.js:/setup/mongo-init.js:ro
    networks:
    - private
  tutor-service:
    restart: unless-stopped
    init: true
    networks: *id001
    profiles:
    - target
    image: ${TUTOR_IMAGE:-tutor-matcher-tutor:pending}
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      CONSUL_URL: http://consul:8500
      DEMO_MODE: 'true'
      PORT: '4001'
      GRPC_PORT: '50053'
      MONGO_URI: mongodb://tutor_owner:${TUTOR_DB_PASSWORD}@mongo:27017/tutor_db?authSource=tutor_db&replicaSet=rs0
      BOOKING_GRPC_URL: booking-service:50052
      AUTH_GRPC_URL: auth-service:50051
      REVIEW_GRPC_URL: review-service:50055
      TUTOR_WORKLOAD_CREDENTIAL: ${TUTOR_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      AUTH_WORKLOAD_CREDENTIAL: ${AUTH_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      BOOKING_WORKLOAD_CREDENTIAL: ${BOOKING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      WALLET_WORKLOAD_CREDENTIAL: ${WALLET_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      MESSAGING_WORKLOAD_CREDENTIAL: ${MESSAGING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
  booking-service:
    restart: unless-stopped
    init: true
    networks: *id001
    profiles:
    - target
    image: ${BOOKING_IMAGE:-tutor-matcher-booking:pending}
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      CONSUL_URL: http://consul:8500
      DEMO_MODE: 'true'
      HTTP_PORT: '4004'
      GRPC_PORT: '50052'
      DATABASE_URL: postgresql://booking_owner:${BOOKING_DB_PASSWORD}@postgres:5432/booking_db
      TUTOR_GRPC_URL: tutor-service:50053
      WALLET_GRPC_URL: wallet-service:50054
      AUTH_GRPC_URL: auth-service:50051
      BOOKING_WORKLOAD_CREDENTIAL: ${BOOKING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      TUTOR_WORKLOAD_CREDENTIAL: ${TUTOR_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      WALLET_WORKLOAD_CREDENTIAL: ${WALLET_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      REVIEW_WORKLOAD_CREDENTIAL: ${REVIEW_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      NOTIFICATION_WORKLOAD_CREDENTIAL: ${NOTIFICATION_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
  wallet-service:
    restart: unless-stopped
    init: true
    networks: *id001
    profiles:
    - target
    image: ${WALLET_IMAGE:-tutor-matcher-wallet:pending}
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      CONSUL_URL: http://consul:8500
      DEMO_MODE: 'true'
      PORT: '4003'
      GRPC_PORT: '50054'
      DATABASE_URL: postgresql://wallet_owner:${WALLET_DB_PASSWORD}@postgres:5432/wallet_db
      AUTH_GRPC_URL: auth-service:50051
      BOOKING_GRPC_URL: booking-service:50052
      TUTOR_GRPC_URL: tutor-service:50053
      WALLET_WORKLOAD_CREDENTIAL: ${WALLET_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      BOOKING_WORKLOAD_CREDENTIAL: ${BOOKING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
  review-service:
    restart: unless-stopped
    init: true
    networks: *id001
    profiles:
    - target
    image: ${REVIEW_IMAGE:-tutor-matcher-review:pending}
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      CONSUL_URL: http://consul:8500
      DEMO_MODE: 'true'
      PORT: '4005'
      GRPC_PORT: '50055'
      MONGO_URI: mongodb://review_owner:${REVIEW_DB_PASSWORD}@mongo:27017/review_db?authSource=review_db&replicaSet=rs0
      AUTH_GRPC_URL: auth-service:50051
      BOOKING_GRPC_URL: booking-service:50052
      REVIEW_WORKLOAD_CREDENTIAL: ${REVIEW_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      TUTOR_WORKLOAD_CREDENTIAL: ${TUTOR_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
  messaging-service:
    restart: unless-stopped
    init: true
    networks: *id001
    profiles:
    - target
    image: ${MESSAGING_IMAGE:-tutor-matcher-messaging:pending}
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      CONSUL_URL: http://consul:8500
      DEMO_MODE: 'true'
      PORT: '4006'
      MONGO_URI: mongodb://messaging_owner:${MESSAGING_DB_PASSWORD}@mongo:27017/messaging_db?authSource=messaging_db&replicaSet=rs0
      AUTH_GRPC_URL: auth-service:50051
      TUTOR_GRPC_URL: tutor-service:50053
      MESSAGING_WORKLOAD_CREDENTIAL: ${MESSAGING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
  notification-service:
    restart: unless-stopped
    init: true
    networks: *id001
    profiles:
    - target
    image: ${NOTIFICATION_IMAGE:-tutor-matcher-notification:pending}
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      CONSUL_URL: http://consul:8500
      DEMO_MODE: 'true'
      PORT: '4007'
      MONGO_URI: mongodb://notification_owner:${NOTIFICATION_DB_PASSWORD}@mongo:27017/notification_db?authSource=notification_db&replicaSet=rs0
      AUTH_GRPC_URL: auth-service:50051
      BOOKING_GRPC_URL: booking-service:50052
      NOTIFICATION_WORKLOAD_CREDENTIAL: ${NOTIFICATION_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
networks:
  private: {}
volumes:
  postgres-data: {}
  mongo-data: {}
  rabbitmq-data: {}
