name: tutor-matcher
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?supply database administrator credential}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?supply owner credential}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?supply owner credential}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?supply owner credential}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infra/docker/postgres-owned-databases.sh:/docker-entrypoint-initdb.d/00-owned-databases.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
    - backend
  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: auth
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_AUTH_PASSWORD:?supply broker producer credential}
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
    - backend
  rabbitmq-provision:
    image: node:22-bookworm-slim
    restart: 'no'
    profiles:
    - target
    networks:
    - backend
    command:
    - node
    - /provision/rabbitmq-provision.mjs
    environment:
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_DEFINITIONS: /provision/rabbitmq-definitions.json
      RABBITMQ_AUTH_PASSWORD: ${RABBITMQ_AUTH_PASSWORD:?supply broker producer credential}
      RABBITMQ_WALLET_PASSWORD: ${RABBITMQ_WALLET_PASSWORD:?supply broker producer credential}
      RABBITMQ_NOTIFICATION_PASSWORD: ${RABBITMQ_NOTIFICATION_PASSWORD:?supply broker producer credential}
      RABBITMQ_TUTOR_PASSWORD: ${RABBITMQ_TUTOR_PASSWORD:?supply tutor publisher password}
      RABBITMQ_REVIEW_PASSWORD: ${RABBITMQ_REVIEW_PASSWORD:?supply review publisher password}
    volumes:
    - ./infra/docker/rabbitmq-provision.mjs:/provision/rabbitmq-provision.mjs:ro
    - ./services/notification-service/deploy/rabbitmq-definitions.json:/provision/rabbitmq-definitions.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
  auth-service:
    restart: unless-stopped
    init: true
    networks:
    - backend
    build:
      context: .
      dockerfile: infra/docker/workspace.Dockerfile
      args:
        WORKSPACE: services/auth-service
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      DEMO_MODE: 'true'
      PORT: '4002'
      GRPC_PORT: '50051'
      DATABASE_URL: postgresql://auth_owner:${AUTH_DB_PASSWORD}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:?supply session signing key}
      RESET_CONTENT_KEY: ${RESET_CONTENT_KEY:?supply reset content encryption key}
      IDEMPOTENCY_SECRET: ${IDEMPOTENCY_SECRET:?supply replay fingerprint key}
      ADMIN_SIGNUP_KEY: ${ADMIN_SIGNUP_KEY:-}
      RABBITMQ_URL: amqp://auth:${RABBITMQ_AUTH_PASSWORD}@rabbitmq:5672
      RESET_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}/password-reset
      AUTH_WORKLOAD_CREDENTIAL: ${AUTH_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      TUTOR_WORKLOAD_CREDENTIAL: ${TUTOR_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      BOOKING_WORKLOAD_CREDENTIAL: ${BOOKING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      WALLET_WORKLOAD_CREDENTIAL: ${WALLET_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      REVIEW_WORKLOAD_CREDENTIAL: ${REVIEW_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      MESSAGING_WORKLOAD_CREDENTIAL: ${MESSAGING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      NOTIFICATION_WORKLOAD_CREDENTIAL: ${NOTIFICATION_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      AUTH_SYNTHETIC_EMAILS: ${AUTH_SYNTHETIC_EMAILS:-}
      AUTH_SYNTHETIC_USER_IDS: ${AUTH_SYNTHETIC_USER_IDS:-}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:-}
      ACTOR_ASSERTION_PRIVATE_KEY: ${ACTOR_ASSERTION_PRIVATE_KEY:?supply actor signing key}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4002/health',{signal:AbortSignal.timeout(1000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: 'true'
      tutor-matcher.gateway: 'true'
      traefik.http.services.auth-service.loadbalancer.server.port: '4002'
      traefik.http.services.auth-service.loadbalancer.healthcheck.path: /health
      traefik.http.services.auth-service.loadbalancer.healthcheck.interval: 2s
      traefik.http.services.auth-service.loadbalancer.healthcheck.timeout: 1s
  api-gateway:
    image: traefik:v3.7.17
    command:
    - --entrypoints.web.address=:8080
    - --entrypoints.auth.address=127.0.0.1:8081
    - --entrypoints.auth.forwardedHeaders.trustedIPs=127.0.0.1/32,::1/128
    - --entrypoints.traefik.address=127.0.0.1:8082
    - --ping=true
    - --api.dashboard=false
    - --providers.file.filename=/etc/traefik/dynamic/routes.yaml
    - --providers.file.watch=true
    - --serversTransport.forwardingTimeouts.dialTimeout=2s
    - --serversTransport.forwardingTimeouts.responseHeaderTimeout=5s
    - --accesslog=true
    - --accesslog.format=json
    - --accesslog.fields.headers.defaultmode=drop
    - --providers.docker.endpoint=tcp://docker-api:2375
    - --providers.docker.exposedbydefault=false
    - --providers.docker.constraints=Label(`tutor-matcher.gateway`, `true`)
    - --providers.docker.defaultRule=PathRegexp(`a^`)
    - --providers.docker.allowEmptyServices=true
    - --providers.docker.network=${COMPOSE_PROJECT_NAME:-tutor-matcher}_backend
    environment:
      TRAEFIK_DISCOVERY_PROVIDER: docker
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
    ports:
    - 127.0.0.1:8080:8080
    volumes:
    - ./infra/gateway/routes.yaml:/etc/traefik/dynamic/routes.yaml:ro
    - ./infra/docker/traefik-start.sh:/usr/local/bin/traefik-start.sh:ro
    networks:
    - backend
    - socket
    depends_on:
    - docker-api
    healthcheck:
      test:
      - CMD
      - traefik
      - healthcheck
      - --ping
      - --entrypoints.traefik.address=127.0.0.1:8082
      interval: 10s
      timeout: 3s
      retries: 3
    restart: on-failure
    entrypoint:
    - /bin/sh
    - /usr/local/bin/traefik-start.sh
  web:
    restart: unless-stopped
    init: true
    networks:
    - backend
    build:
      context: .
      dockerfile: infra/docker/workspace.Dockerfile
      args:
        WORKSPACE: apps/web
    ports:
    - 127.0.0.1:3000:3000
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
    - api-gateway
  mongo:
    image: mongo:7
    profiles:
    - target
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?supply Mongo administrator credential}
      MONGO_CLUSTER_KEY: ${MONGO_CLUSTER_KEY:?supply replica-set key}
    entrypoint:
    - /bin/bash
    - -ec
    command:
    - printf "%s" "$$MONGO_CLUSTER_KEY" > /tmp/replica-key; chmod 400 /tmp/replica-key; chown mongodb /tmp/replica-key; exec
      docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/replica-key
    volumes:
    - mongo-data:/data/db
    networks:
    - backend
  mongo-init:
    image: mongo:7
    profiles:
    - target
    restart: on-failure
    depends_on:
    - mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      TUTOR_DB_PASSWORD: ${TUTOR_DB_PASSWORD:?supply owner credential}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?supply owner credential}
      MESSAGING_DB_PASSWORD: ${MESSAGING_DB_PASSWORD:?supply owner credential}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?supply owner credential}
    entrypoint:
    - mongosh
    - --host
    - mongo
    - --quiet
    - /setup/mongo-init.js
    volumes:
    - ./infra/docker/mongo-init.js:/setup/mongo-init.js:ro
    networks:
    - backend
  tutor-service:
    restart: unless-stopped
    init: true
    networks:
    - backend
    profiles:
    - target
    image: ${TUTOR_IMAGE:-tutor-matcher-tutor:local}
    cpus: 0.5
    build:
      context: .
      dockerfile: infra/docker/workspace.Dockerfile
      args:
        WORKSPACE: services/tutor-service
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      DEMO_MODE: 'true'
      PORT: '4001'
      GRPC_PORT: '50053'
      MONGO_URI: mongodb://tutor_owner:${TUTOR_DB_PASSWORD}@mongo:27017/tutor_db?authSource=tutor_db&replicaSet=rs0
      BOOKING_GRPC_URL: booking-service:50052
      AUTH_GRPC_URL: auth-service:50051
      REVIEW_HTTP_URL: http://review-service:4005
      RABBITMQ_URL: amqp://tutor:${RABBITMQ_TUTOR_PASSWORD:?supply tutor publisher password}@rabbitmq:5672
      REVIEW_GRPC_URL: review-service:50055
      TUTOR_WORKLOAD_CREDENTIAL: ${TUTOR_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      AUTH_WORKLOAD_CREDENTIAL: ${AUTH_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      BOOKING_WORKLOAD_CREDENTIAL: ${BOOKING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      WALLET_WORKLOAD_CREDENTIAL: ${WALLET_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      MESSAGING_WORKLOAD_CREDENTIAL: ${MESSAGING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      rabbitmq-provision:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4001/health',{signal:AbortSignal.timeout(1000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: 'true'
      tutor-matcher.gateway: 'true'
      traefik.http.services.tutor-service.loadbalancer.server.port: '4001'
      traefik.http.services.tutor-service.loadbalancer.healthcheck.path: /health
      traefik.http.services.tutor-service.loadbalancer.healthcheck.interval: 2s
      traefik.http.services.tutor-service.loadbalancer.healthcheck.timeout: 1s
  booking-service:
    restart: unless-stopped
    init: true
    networks:
    - backend
    profiles:
    - target
    image: ${BOOKING_IMAGE:-tutor-matcher-booking:pending}
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      DEMO_MODE: 'true'
      HTTP_PORT: '4004'
      GRPC_PORT: '50052'
      DATABASE_URL: postgresql://booking_owner:${BOOKING_DB_PASSWORD}@postgres:5432/booking_db
      TUTOR_GRPC_URL: tutor-service:50053
      WALLET_GRPC_URL: wallet-service:50054
      AUTH_GRPC_URL: auth-service:50051
      BOOKING_WORKLOAD_CREDENTIAL: ${BOOKING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      TUTOR_WORKLOAD_CREDENTIAL: ${TUTOR_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      WALLET_WORKLOAD_CREDENTIAL: ${WALLET_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      REVIEW_WORKLOAD_CREDENTIAL: ${REVIEW_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      NOTIFICATION_WORKLOAD_CREDENTIAL: ${NOTIFICATION_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4004/health',{signal:AbortSignal.timeout(1000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: 'true'
      tutor-matcher.gateway: 'true'
      traefik.http.services.booking-service.loadbalancer.server.port: '4004'
      traefik.http.services.booking-service.loadbalancer.healthcheck.path: /health
      traefik.http.services.booking-service.loadbalancer.healthcheck.interval: 2s
      traefik.http.services.booking-service.loadbalancer.healthcheck.timeout: 1s
  wallet-service:
    restart: unless-stopped
    init: true
    networks:
    - backend
    profiles:
    - target
    build:
      context: .
      dockerfile: infra/docker/workspace.Dockerfile
      args:
        WORKSPACE: services/wallet-service
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      DEMO_MODE: 'true'
      PORT: '4003'
      GRPC_PORT: '50054'
      DATABASE_URL: postgresql://wallet_owner:${WALLET_DB_PASSWORD}@postgres:5432/wallet_db
      RABBITMQ_URL: amqp://wallet:${RABBITMQ_WALLET_PASSWORD}@rabbitmq:5672
      PAYOUT_FINGERPRINT_KEY: ${PAYOUT_FINGERPRINT_KEY:?supply payout duplicate-detection key}
      AUTH_GRPC_URL: auth-service:50051
      BOOKING_GRPC_URL: booking-service:50052
      TUTOR_GRPC_URL: tutor-service:50053
      WALLET_WORKLOAD_CREDENTIAL: ${WALLET_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      BOOKING_WORKLOAD_CREDENTIAL: ${BOOKING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-provision:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4003/health',{signal:AbortSignal.timeout(1000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: 'true'
      tutor-matcher.gateway: 'true'
      traefik.http.services.wallet-service.loadbalancer.server.port: '4003'
      traefik.http.services.wallet-service.loadbalancer.healthcheck.path: /health
      traefik.http.services.wallet-service.loadbalancer.healthcheck.interval: 2s
      traefik.http.services.wallet-service.loadbalancer.healthcheck.timeout: 1s
  review-service:
    restart: unless-stopped
    init: true
    networks:
    - backend
    profiles:
    - target
    image: ${REVIEW_IMAGE:-tutor-matcher-review:local}
    build:
      context: .
      dockerfile: infra/docker/workspace.Dockerfile
      args:
        WORKSPACE: services/review-service
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      DEMO_MODE: 'true'
      PORT: '4005'
      GRPC_PORT: '50055'
      MONGO_URI: mongodb://review_owner:${REVIEW_DB_PASSWORD}@mongo:27017/review_db?authSource=review_db&replicaSet=rs0
      AUTH_GRPC_URL: auth-service:50051
      RABBITMQ_URL: amqp://review:${RABBITMQ_REVIEW_PASSWORD:?supply review publisher password}@rabbitmq:5672
      BOOKING_GRPC_URL: booking-service:50052
      REVIEW_WORKLOAD_CREDENTIAL: ${REVIEW_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      TUTOR_WORKLOAD_CREDENTIAL: ${TUTOR_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      rabbitmq-provision:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4005/health',{signal:AbortSignal.timeout(1000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: 'true'
      tutor-matcher.gateway: 'true'
      traefik.http.services.review-service.loadbalancer.server.port: '4005'
      traefik.http.services.review-service.loadbalancer.healthcheck.path: /health
      traefik.http.services.review-service.loadbalancer.healthcheck.interval: 2s
      traefik.http.services.review-service.loadbalancer.healthcheck.timeout: 1s
  messaging-service:
    restart: unless-stopped
    init: true
    networks:
    - backend
    profiles:
    - target
    image: ${MESSAGING_IMAGE:-tutor-matcher-messaging:pending}
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      DEMO_MODE: 'true'
      PORT: '4006'
      MONGO_URI: mongodb://messaging_owner:${MESSAGING_DB_PASSWORD}@mongo:27017/messaging_db?authSource=messaging_db&replicaSet=rs0
      AUTH_GRPC_URL: auth-service:50051
      TUTOR_GRPC_URL: tutor-service:50053
      MESSAGING_WORKLOAD_CREDENTIAL: ${MESSAGING_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4006/health',{signal:AbortSignal.timeout(1000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: 'true'
      tutor-matcher.gateway: 'true'
      traefik.http.services.messaging-service.loadbalancer.server.port: '4006'
      traefik.http.services.messaging-service.loadbalancer.healthcheck.path: /health
      traefik.http.services.messaging-service.loadbalancer.healthcheck.interval: 2s
      traefik.http.services.messaging-service.loadbalancer.healthcheck.timeout: 1s
  notification-service:
    restart: unless-stopped
    init: true
    networks:
    - backend
    profiles:
    - target
    build:
      context: .
      dockerfile: infra/docker/workspace.Dockerfile
      args:
        WORKSPACE: services/notification-service
    environment:
      ACTOR_ASSERTION_PUBLIC_KEY: ${ACTOR_ASSERTION_PUBLIC_KEY:?supply actor verification key}
      DEMO_MODE: 'true'
      PORT: '4007'
      MONGO_URI: mongodb://notification_owner:${NOTIFICATION_DB_PASSWORD}@mongo:27017/notification_db?authSource=notification_db&replicaSet=rs0
      RABBITMQ_URL: amqp://notification:${RABBITMQ_NOTIFICATION_PASSWORD}@rabbitmq:5672
      AUTH_GRPC_URL: auth-service:50051
      BOOKING_GRPC_URL: booking-service:50052
      NOTIFICATION_WORKLOAD_CREDENTIAL: ${NOTIFICATION_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
      GATEWAY_WORKLOAD_CREDENTIAL: ${GATEWAY_WORKLOAD_CREDENTIAL:?supply distinct workload credential}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      rabbitmq-provision:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4007/health',{signal:AbortSignal.timeout(1000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: 'true'
      tutor-matcher.gateway: 'true'
      traefik.http.services.notification-service.loadbalancer.server.port: '4007'
      traefik.http.services.notification-service.loadbalancer.healthcheck.path: /health
      traefik.http.services.notification-service.loadbalancer.healthcheck.interval: 2s
      traefik.http.services.notification-service.loadbalancer.healthcheck.timeout: 1s
  docker-api:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: '1'
      NETWORKS: '1'
      EVENTS: '1'
      POST: '0'
      LOG_LEVEL: warning
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - socket
    restart: on-failure
networks:
  backend: {}
  socket:
    internal: true
volumes:
  postgres-data: {}
  mongo-data: {}
  rabbitmq-data: {}
